services:
  postgres:
    image: postgres:16-alpine
    container_name: anoq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: anoq_db
      POSTGRES_USER: anoq_user
      POSTGRES_PASSWORD: anoq_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/migrations/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anoq_user -d anoq_db"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
